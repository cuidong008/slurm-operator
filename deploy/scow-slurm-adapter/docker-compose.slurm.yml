# 叠加使用：挂载与集群一致的 slurm.conf，使 scontrol 能列出分区（OpenSCOW 仪表盘 getClusterInfo 需要）。
#
# 准备 slurm.conf（在 deploy/scow-slurm-adapter 目录）：
#   NS=slurm PATCH_CLUSTERIP=1 bash hack/fetch-slurm-conf-for-adapter.sh
# PATCH_CLUSTERIP 会把 SlurmctldHost 改成 slurm-controller Service 的 ClusterIP，便于本机 Docker/bridge 或
# 与 docker-compose.hostnet.yml 联用时能连上 slurmctld（6817）。
#
# 若集群使用 Munge 且 scontrol 报认证错误，再叠加：-f docker-compose.munge.yml（并放置 munge.key）。
#
# 集群为 auth/slurm 时还需 slurm.key + jwt.key 与 sackd，请再叠加 docker-compose.slurm-auth.yml，并执行
#   bash hack/fetch-slurm-auth-keys-for-adapter.sh
#
# 启动示例：
#   docker compose -f docker-compose.yml -f docker-compose.slurm.yml up -d --build
# 本机 K8s 节点上建议同时 host 网络（连 MySQL / ClusterIP 更稳）：
#   docker compose -f docker-compose.yml -f docker-compose.hostnet.yml -f docker-compose.slurm.yml -f docker-compose.slurm-auth.yml up -d --build

services:
  scow-slurm-adapter:
    volumes:
      - ./slurm.conf:/etc/slurm/slurm.conf:ro
