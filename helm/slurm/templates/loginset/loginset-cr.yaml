{{- range $key, $loginset := $.Values.loginsets }}
{{- if $loginset.enabled }}
{{- $name := printf "%s-%s" (include "slurm.login.name" $) $key }}
{{- $metadata := merge dict ($loginset.metadata | default dict) (dict "labels" (fromYaml (include "slurm.labels" $))) -}}
{{- $podSpec := deepCopy ($loginset.podSpec | default dict) -}}
{{- $login := deepCopy $loginset.login -}}
{{- /* Default privileged=true for login container unless explicitly set */ -}}
{{- if not (hasKey $login "securityContext") -}}
  {{- $_ := set $login "securityContext" (dict "privileged" true) -}}
{{- end -}}
{{- $imagePullSecrets := concat list ($podSpec.imagePullSecrets | default list) ($.Values.imagePullSecrets | default list) -}}
{{- $_ := set $podSpec "imagePullSecrets" $imagePullSecrets -}}
{{- $priorityClassName := $podSpec.priorityClassName | default (include "slurm.priorityClassName" $) -}}
{{- $_ := set $podSpec "priorityClassName" $priorityClassName -}}
{{- $claim := include "slurm.sharedHome.claimName" $ | trim -}}
{{- if and (default false $.Values.sharedHome.enabled) (ne $claim "") -}}
{{- $sh := $.Values.sharedHome | default dict -}}
{{- $mountPath := $sh.mountPath | default "/home" -}}
{{- $vn := $sh.volumeName | default "shared-home" -}}
{{- $vols := $podSpec.volumes | default list -}}
{{- $pvcVol := dict "name" $vn "persistentVolumeClaim" (dict "claimName" $claim) -}}
{{- $_ := set $podSpec "volumes" (append $vols $pvcVol) -}}
{{- $mounts := $login.volumeMounts | default list -}}
{{- $_ := set $login "volumeMounts" (append $mounts (dict "name" $vn "mountPath" $mountPath)) -}}
{{- end -}}
{{- $swClaim := include "slurm.sharedSoftware.claimName" $ | trim -}}
{{- if and (default false $.Values.sharedSoftware.enabled) (ne $swClaim "") -}}
{{- $ss := $.Values.sharedSoftware | default dict -}}
{{- $swMount := $ss.mountPath | default "/software" -}}
{{- $swVol := $ss.volumeName | default "shared-software" -}}
{{- $vols2 := $podSpec.volumes | default list -}}
{{- $swPvcVol := dict "name" $swVol "persistentVolumeClaim" (dict "claimName" $swClaim) -}}
{{- $_ := set $podSpec "volumes" (append $vols2 $swPvcVol) -}}
{{- $swMounts := $login.volumeMounts | default list -}}
{{- $_ := set $login "volumeMounts" (append $swMounts (dict "name" $swVol "mountPath" $swMount)) -}}
{{- end -}}
{{- $sdClaim := include "slurm.sharedData.claimName" $ | trim -}}
{{- if and (default false $.Values.sharedData.enabled) (ne $sdClaim "") -}}
{{- $sd := $.Values.sharedData | default dict -}}
{{- $sdMount := $sd.mountPath | default "/data" -}}
{{- $sdVol := $sd.volumeName | default "shared-data" -}}
{{- $vols3 := $podSpec.volumes | default list -}}
{{- $sdPvcVol := dict "name" $sdVol "persistentVolumeClaim" (dict "claimName" $sdClaim) -}}
{{- $_ := set $podSpec "volumes" (append $vols3 $sdPvcVol) -}}
{{- $sdMounts := $login.volumeMounts | default list -}}
{{- $_ := set $login "volumeMounts" (append $sdMounts (dict "name" $sdVol "mountPath" $sdMount)) -}}
{{- end -}}
{{- $podTemplate := dict "metadata" $metadata "spec" $podSpec }}
---
apiVersion: slinky.slurm.net/v1beta1
kind: LoginSet
metadata:
  name: {{ $name }}
  namespace: {{ include "slurm.namespace" $ }}
{{- with $metadata }}
  {{- toYaml . | nindent 2 }}
{{- end }}{{- /* with $metadata */}}
spec:
  controllerRef:
    name: {{ include "slurm.fullname" $ }}
    namespace: {{ include "slurm.namespace" $ }}
  {{- with $loginset.extraSshdConfig }}
  extraSshdConfig: |
    {{- . | nindent 4 }}
  {{- end }}{{- /* with $loginset.extraSshdConfig */}}
  sssdConfRef:
    name: {{ include "slurm.sssdConf.name" $ }}
    key: {{ include "slurm.sssdConf.key" $ }}
  {{- with $loginset.rootSshAuthorizedKeys }}
  rootSshAuthorizedKeys: |
    {{- . | nindent 4 }}
  {{- end }}{{- /* with $loginset.rootSshAuthorizedKeys */}}
  replicas: {{ $loginset.replicas }}
  {{- with $loginset.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}{{- /* with $loginset.strategy */}}
  login:
    {{- $_ := set $login "imagePullPolicy" (get $login "imagePullPolicy" | default $.Values.imagePullPolicy ) -}}
    {{- include "format-container" $login | nindent 4 }}
  {{- include "format-podTemplate" $podTemplate | nindent 2 }}
  initconf:
    {{- $_ := set $loginset.initconf "imagePullPolicy" (default $.Values.imagePullPolicy $loginset.initconf.imagePullPolicy) -}}
    {{- include "format-container" $loginset.initconf | nindent 4 }}
  {{- with $loginset.service }}
  service:
    {{- toYaml . | nindent 4 }}
  {{- end }}{{- /* with $loginset.service */}}
{{- end }}{{- /* $loginset.enabled */}}
{{- end }}{{- /* range $loginset := $.Values.loginsets */}}
