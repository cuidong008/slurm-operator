{{- $sd := .Values.sharedData | default dict -}}
{{- $p := $sd.persistence | default dict -}}
{{- if and (default false $sd.enabled) (default true $p.enabled) (default true $p.create) (not $p.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-shared-data" (include "slurm.fullname" .) }}
  namespace: {{ include "slurm.namespace" . }}
  labels:
    {{- include "slurm.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-data
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  {{- if $p.storageClassName }}
  storageClassName: {{ $p.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size | quote }}
{{- end }}
