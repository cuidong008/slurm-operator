# 最小 Bitnami OpenLDAP（测试用，无 Web 管理界面）。
# Docker Compose 等价栈（持久化、TLS）：examples/docker-compose.openldap.yml（宿主机 389/636）
#
# 部署前：
#   1. 将镜像同步到 Harbor（集群只拉 Harbor 时必做）：
#        export HARBOR_USERNAME=... HARBOR_PASSWORD=...
#        ./hack/push-bitnami-openldap-to-harbor.sh
#      OpenLDAP：见下方 **image**（Harbor 上的 tag；勿把 Docker Hub 的 digest 填进 harbor 域名，见 Deployment 注释）。
#      上游：docker.io/bitnamilegacy/openldap
#   2. 【必须先执行】生成 TLS Secret **openldap-bitnami-tls**（无则 openldap 无法挂载 /certs，kubelet 报
#      FailedMount / secret not found，Pod 长期 ContainerCreating）：
#        ./hack/gen-openldap-bitnami-tls-secret.sh openldap
#   3. kubectl create namespace openldap   # 若尚未创建
#      kubectl apply -n openldap -f examples/openldap-bitnami-minimal.yaml
#
# 与 Slurm / SSSD 对齐：
#   ldap_uri = ldap://openldap.openldap.svc.cluster.local:389
#   ldap_search_base = dc=example,dc=org
#   ldap_default_bind_dn = cn=admin,dc=example,dc=org
#   ldap_default_authtok = <LDAP_ADMIN_PASSWORD>
#
# 从旧 osixia 数据迁到 Bitnami 需重新 slapadd / 导入 LDIF，不能复用原 PVC。
#
# 持久化（与 examples/docker-compose.openldap.yml 一致）：**两个 PVC** 分别挂
#   /bitnami/openldap/data、/bitnami/openldap/slapd.d。
# 勿将 emptyDir/PVC **整卷挂载到 /bitnami/openldap**（单卷盖住整棵树会触发 slapadd/LMDB 初始化失败）。
# initContainer **openldap-data-init** 对两卷 chown 1001（与 compose 里 busybox 同理）。
# 若集群无默认 StorageClass，请在下方两个 PVC 上填写 **storageClassName**，否则 PVC 会一直 Pending。
#
# 容器内 **LDAP_PORT_NUMBER=1389 / LDAP_LDAPS_PORT_NUMBER=1636**（非 root 无需绑定特权端口）；ClusterIP Service
# 仍将 **389→1389、636→1636**，故客户端仍写 **ldap://openldap...:389**。
# 允许客户端走明文 389 做绑定调试；SSSD 仍应对 389 使用 StartTLS（LDAP_REQUIRE_TLS=no / LDAP_ENABLE_TLS=yes）。
#
# 仅用于实验环境；生产请使用强密码、合适的 TLS 策略与存储容量/StorageClass。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-data
  labels:
    app: openldap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-slapd-d
  labels:
    app: openldap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  labels:
    app: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: openldap-data-init
          image: harbor.aix.com:8443/library/busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1001:1001 /bitnami/openldap/data /bitnami/openldap/slapd.d && chmod 755 /bitnami/openldap/data /bitnami/openldap/slapd.d
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: openldap-data
              mountPath: /bitnami/openldap/data
            - name: openldap-slapd-d
              mountPath: /bitnami/openldap/slapd.d
      volumes:
        - name: openldap-data
          persistentVolumeClaim:
            claimName: openldap-data
        - name: openldap-slapd-d
          persistentVolumeClaim:
            claimName: openldap-slapd-d
        - name: openldap-bitnami-tls
          secret:
            secretName: openldap-bitnami-tls
            defaultMode: 0640
      containers:
        - name: openldap
          # 使用 Harbor tag（勿写 docker.io 的 digest）：同一镜像推到不同 registry 时，**manifest digest 会不同**
          # （Docker Hub 常为 sha256:687f14…，Harbor 上常为另一条如 sha256:627f63…），层 ID 一致即可。
          # 推送：docker pull bitnamilegacy/openldap:2.6.10-debian-12-r1 → tag → push；见 hack/verify-bitnami-openldap-image.sh
          image: harbor.aix.com:8443/library/bitnami-openldap:2.6.10-debian-12-r1
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: openldap-data
              mountPath: /bitnami/openldap/data
            - name: openldap-slapd-d
              mountPath: /bitnami/openldap/slapd.d
            - name: openldap-bitnami-tls
              mountPath: /certs
              readOnly: true
          ports:
            - name: ldap
              containerPort: 1389
            - name: ldaps
              containerPort: 1636
          env:
            # 排障时可改为 true，查看 slapadd 等详细输出（kubectl logs）
            - name: BITNAMI_DEBUG
              value: "false"
            - name: LDAP_PORT_NUMBER
              value: "1389"
            - name: LDAP_LDAPS_PORT_NUMBER
              value: "1636"
            - name: LDAP_ROOT
              value: "dc=example,dc=org"
            - name: LDAP_ADMIN_USERNAME
              value: "admin"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin"
            # 允许本机/调试工具走明文 389；SSSD 仍应对 389 使用 StartTLS
            - name: LDAP_REQUIRE_TLS
              value: "no"
            - name: LDAP_ENABLE_TLS
              value: "yes"
            - name: LDAP_TLS_CERT_FILE
              value: "/certs/tls.crt"
            - name: LDAP_TLS_KEY_FILE
              value: "/certs/tls.key"
            - name: LDAP_TLS_CA_FILE
              value: "/certs/ca.crt"
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  labels:
    app: openldap
spec:
  type: ClusterIP
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: ldap
    - name: ldaps
      port: 636
      targetPort: ldaps
